services:
  node-a:
    build: .
    environment:
      NODE_ID: node-a
      HTTP_PORT: 8080
      GRPC_PORT: 9090
      STORAGE_PATH: /data/rocksdb
    ports:
      - "8080:8080"
    volumes:
      - node-a-data:/data
  node-b:
    build: .
    environment:
      NODE_ID: node-b
      HTTP_PORT: 8080
      GRPC_PORT: 9090
      STORAGE_PATH: /data/rocksdb
    ports:
      - "8081:8080"
    volumes:
      - node-b-data:/data
  node-c:
    build: .
    environment:
      NODE_ID: node-c
      HTTP_PORT: 8080
      GRPC_PORT: 9090
      STORAGE_PATH: /data/rocksdb
    ports:
      - "8082:8080"
    volumes:
      - node-c-data:/data
volumes:
  node-a-data:
  node-b-data:
  node-c-data:
